name: Foundation checks
on:
  push:
    branches: ['codex/secure-foundation-cloud', 'codex/real-lmu-import-phase2']
  pull_request:
    branches: [main, 'codex/secure-foundation-cloud']
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies and build DEMO
        run: npm run setup:cloud
      - name: Synthetic unit tests
        run: npm test
      - name: Audit publication and runtime boundaries
        run: |
          npm run check:publication
          npm run check:security
          npm run check:provenance
      - name: Scan outgoing Git history with pinned Gitleaks
        run: |
          mkdir -p .cache/security
          curl --fail --location --retry 2 --output .cache/security/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .cache/security/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .cache/security/gitleaks.tar.gz -C .cache/security gitleaks LICENSE
          .cache/security/gitleaks git .. --config .gitleaks.toml --log-opts="origin/main..HEAD" --redact --no-banner
          npm run check:publication -- --range=origin/main..HEAD
      - name: Verify root base
        run: |
          npm run build -- --base=/
          npm run check:build
      - name: Install Chromium for synthetic browser checks
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.cache/playwright" node node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser acceptance (DEMO only)
        run: npm run test:e2e
      - name: Native Worker import using generated synthetic databases
        run: npm run test:import:e2e
